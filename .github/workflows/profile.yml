name: Profile refresh

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "profile-3d-contrib/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  render:
    name: Render cards
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Terminal card — base + languages
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@master
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.terminal.svg
          output_action: none
          template: terminal
          base: header, metadata
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile

      - name: 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Isometric commit calendar
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.calendar.svg
          output_action: none
          base: ""
          config_timezone: Asia/Jakarta
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Lines of code changed
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.lines.svg
          output_action: none
          base: ""
          plugin_lines: yes

      - name: Collect rendered cards into the workspace
        run: |
          if [ -d /metrics_renders/assets ]; then
            sudo cp -r /metrics_renders/assets/. assets/
            sudo chown -R "$(id -u):$(id -g)" assets
            ls -la assets
          else
            echo "no metrics renders (PAT missing?)"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cards
          path: |
            assets
            profile-3d-contrib
          if-no-files-found: error

  commit:
    name: Commit cards
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: cards
          path: .

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets profile-3d-contrib/profile-night-view.svg
          if git diff --staged --quiet; then
            echo "cards unchanged"
          else
            git commit -m "chore(profile): refresh generated cards"
            git push
          fi

  activity:
    name: Refresh activity feed
    needs: commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_LINES: 8
