name: Profile refresh

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "profile-3d-contrib/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  render:
    name: Render cards
    runs-on: ubuntu-latest
    env:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Terminal stats card
        uses: yogeshwaran01/github-stats-terminal-style@master
        with:
          username: ${{ github.repository_owner }}
          theme: gruvbox
          headerStyle: mac
          commands: whoami,neofetch,languages,uptime,exit
          outputPath: assets/github_stats.svg

      - name: 3D contribution skyline
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Crypto — 30 days
        uses: lowlighter/metrics@v3.34
        with:
          token: NOT_NEEDED
          filename: assets/metrics.crypto.svg
          output_action: none
          base: ""
          plugin_crypto: yes
          plugin_crypto_id: bitcoin
          plugin_crypto_vs_currency: usd
          plugin_crypto_days: 30
          plugin_crypto_precision: 0

      - name: Habits — when the work happens
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.habits.svg
          output_action: none
          base: ""
          config_timezone: Asia/Jakarta
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes

      - name: Languages — by bytes written
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.languages.svg
          output_action: none
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, scss, shell, dockerfile, makefile

      - name: Activity — last 14 days
        if: env.METRICS_TOKEN != ''
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics.activity.svg
          output_action: none
          base: ""
          config_timezone: Asia/Jakarta
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 14
          plugin_activity_timestamps: yes
          plugin_activity_filter: push, issue, pr, review, release, fork

      - uses: actions/upload-artifact@v4
        with:
          name: cards
          path: |
            assets
            profile-3d-contrib
          if-no-files-found: error

  commit:
    name: Commit cards
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: cards
          path: .

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets profile-3d-contrib/profile-night-view.svg
          if git diff --staged --quiet; then
            echo "cards unchanged"
          else
            git commit -m "chore(profile): refresh generated cards"
            git push
          fi

  activity:
    name: Refresh activity feed
    needs: commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_LINES: 8
