name: 3D contributions

on:
  schedule:
    - cron: "47 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "profile-3d-contrib/**"
      - "README.md"


permissions:
  contents: write

concurrency:
  group: profile-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit skyline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib/profile-night-view.svg
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore(3d): refresh contribution skyline"
            git push
          fi
